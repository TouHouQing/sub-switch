name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to package and publish'
        required: true
        default: 'v3.16.24'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2022
            platform: windows
            arch: x86_64
          - label: Linux x64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
          - label: Linux ARM64
            os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
          - label: macOS Universal
            os: macos-14
            platform: macos
            arch: universal

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos'
        shell: bash
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify appdmg availability
        if: matrix.platform == 'macos'
        shell: bash
        run: npx --yes appdmg@0.6.6 --help >/dev/null

      - name: Disable updater signing for downloadable packages
        shell: bash
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/tauri.release.overlay.json"
          cat > "$overlay" <<'EOF'
          {"bundle":{"createUpdaterArtifacts":false}}
          EOF
          echo "TAURI_RELEASE_CONFIG=$overlay" >> "$GITHUB_ENV"

      - name: Detect macOS signing mode
        if: matrix.platform == 'macos'
        id: macos-signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "macOS Developer ID signing and notarization are enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            printf 'macOS Developer ID signing and notarization are disabled. Missing secrets: %s\n' "${missing[*]}" >&2
            echo "The release will publish an unsigned drag-to-Applications DMG and an installer script that removes the quarantine attribute after installing." >&2
          fi

      - name: Build signed macOS app bundle
        if: matrix.platform == 'macos' && steps.macos-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config "$TAURI_RELEASE_CONFIG" --ignore-version-mismatches

      - name: Build unsigned macOS app bundle
        if: matrix.platform == 'macos' && steps.macos-signing.outputs.enabled != 'true'
        shell: bash
        run: |
          set -euo pipefail
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          pnpm tauri build --target universal-apple-darwin --bundles app --config "$TAURI_RELEASE_CONFIG" --ignore-version-mismatches

      - name: Build Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pnpm tauri build --config "$env:TAURI_RELEASE_CONFIG" --ignore-version-mismatches

      - name: Build Linux app
        if: matrix.platform == 'linux'
        shell: bash
        run: pnpm tauri build --bundles appimage,deb,rpm --config "$TAURI_RELEASE_CONFIG" --ignore-version-mismatches

      - name: Collect macOS assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          app_path=$(find src-tauri/target -path '*/release/bundle/macos/*.app' -type d | head -1 || true)
          if [ -z "$app_path" ]; then
            echo "No macOS .app bundle found" >&2
            find src-tauri/target -maxdepth 6 -type f -o -type d | sed -n '1,200p'
            exit 1
          fi
          if [ "${{ steps.macos-signing.outputs.enabled }}" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app_path"
            spctl -a -vvv -t exec "$app_path"
            xcrun stapler validate "$app_path"
          else
            echo "Skipping Developer ID, notarization, and Gatekeeper verification for unsigned macOS build."
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/THQ-Switch-${RELEASE_TAG}-macOS.zip"
          bash scripts/build-macos-dmg.sh "$app_path" "release-assets/THQ-Switch-${RELEASE_TAG}-macOS.dmg"
          sed "s/__THQ_SWITCH_RELEASE_TAG__/${RELEASE_TAG}/g" scripts/install-macos.sh > "release-assets/THQ-Switch-${RELEASE_TAG}-install-macos.sh"
          chmod +x "release-assets/THQ-Switch-${RELEASE_TAG}-install-macos.sh"
          ls -la release-assets

      - name: Collect Windows assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $msi = Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter '*.msi' | Select-Object -First 1
          if ($null -eq $msi) {
            Get-ChildItem -Path 'src-tauri/target' -Recurse | Select-Object -First 200 | Format-Table FullName
            throw 'No Windows MSI bundle found'
          }
          Copy-Item $msi.FullName "release-assets/THQ-Switch-$env:RELEASE_TAG-Windows.msi"

          $exe = Get-ChildItem -Path 'src-tauri/target' -Recurse -Filter 'thq-switch.exe' | Where-Object { $_.FullName -match '\\release\\' } | Select-Object -First 1
          if ($null -ne $exe) {
            $portableDir = 'release-assets/THQ-Switch-Portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exe.FullName $portableDir
            Set-Content -Path (Join-Path $portableDir 'portable.ini') -Value @('# THQ Switch portable build marker', 'portable=true') -Encoding UTF8
            Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/THQ-Switch-$env:RELEASE_TAG-Windows-Portable.zip" -Force
            Remove-Item -Recurse -Force $portableDir
          }
          Get-ChildItem release-assets

      - name: Collect Linux assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          appimage=$(find src-tauri/target -name '*.AppImage' -type f | head -1 || true)
          deb=$(find src-tauri/target -name '*.deb' -type f | head -1 || true)
          rpm=$(find src-tauri/target -name '*.rpm' -type f | head -1 || true)
          if [ -z "$appimage" ]; then
            echo "No Linux AppImage bundle found" >&2
            find src-tauri/target -maxdepth 6 -type f | sed -n '1,200p'
            exit 1
          fi
          cp "$appimage" "release-assets/THQ-Switch-${RELEASE_TAG}-Linux-${{ matrix.arch }}.AppImage"
          [ -n "$deb" ] && cp "$deb" "release-assets/THQ-Switch-${RELEASE_TAG}-Linux-${{ matrix.arch }}.deb"
          [ -n "$rpm" ] && cp "$rpm" "release-assets/THQ-Switch-${RELEASE_TAG}-Linux-${{ matrix.arch }}.rpm"
          ls -la release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: ls -la release-assets

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: THQ Switch ${{ env.RELEASE_TAG }} - THQ 中转站客户端
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## THQ 中转站客户端

            固定使用你的 AI 中转站：[sub.tohoqing.com](https://sub.tohoqing.com)

            ### 下载

            - **macOS 一键安装**: `curl -fsSL https://github.com/TouHouQing/sub-switch/releases/download/${{ env.RELEASE_TAG }}/THQ-Switch-${{ env.RELEASE_TAG }}-install-macos.sh | bash`
            - **macOS 引导安装**: `THQ-Switch-${{ env.RELEASE_TAG }}-macOS.dmg`（打开 DMG 后按窗口里的 1 → 2 → 3 → 4：先拖入 Applications，再双击 `2 Open Terminal.app` 打开终端，然后先输入 `bash `，最后把 `3-install.sh` 拖进终端并按 Return/回车）
            - **macOS ZIP**: `THQ-Switch-${{ env.RELEASE_TAG }}-macOS.zip`
            - **Windows**: `THQ-Switch-${{ env.RELEASE_TAG }}-Windows.msi` 或 `THQ-Switch-${{ env.RELEASE_TAG }}-Windows-Portable.zip`
            - **Linux x86_64**: `THQ-Switch-${{ env.RELEASE_TAG }}-Linux-x86_64.AppImage` / `.deb` / `.rpm`
            - **Linux ARM64**: `THQ-Switch-${{ env.RELEASE_TAG }}-Linux-arm64.AppImage` / `.deb` / `.rpm`

            说明：如果仓库配置了 Apple Developer ID 签名和公证 secrets，macOS App 会在发布前校验签名、公证 ticket 和 Gatekeeper assessment。未配置时会发布 unsigned 版本；DMG 窗口内置 `3-install.sh` 引导脚本。不要直接运行或双击 `.sh` 文件；必须在 Terminal 里先输入 `bash `，再把 `3-install.sh` 拖进去并按 Return/回车。最终命令应类似 `bash /Volumes/THQ\ Switch/3-install.sh`。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
